<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>SolarDB 切版，生產維持 M2</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="solardb-m2-title solardb-m2-desc">
    <title id="solardb-m2-title">SolarDB 切版，生產維持 M2</title>
    <desc id="solardb-m2-desc">上游 v2.2 已切版但未晉升；生產骨幹維持 M2；Detroit 日前一天協定鎖定，遷移實驗下週才跑。</desc>
    <defs>
      <marker id="solardb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#5c5c5c"/>
      </marker>
      <marker id="solardb-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e75b6"/>
      </marker>
      <marker id="solardb-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1f5a8f"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <text x="40" y="24" fill="#5c5c5c" font-size="8" font-weight="500" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" letter-spacing="0.18em">ARCHITECTURE · SOLARDB</text>
    <text x="40" y="60" fill="#2e75b6" font-size="32" font-weight="700" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">v2.2 切了，冠軍仍是 M2</text>

    <!-- Zones before arrows and nodes -->
    <rect x="40" y="120" width="380" height="460" rx="8" fill="rgba(45,45,45,0.02)" stroke="rgba(45,45,45,0.10)" stroke-width="0.8"/>
    <rect x="176" y="124" width="108" height="16" rx="2" fill="#ffffff"/>
    <text x="230" y="136" fill="rgba(45,45,45,0.40)" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.14em">UPSTREAM</text>

    <rect x="440" y="120" width="400" height="460" rx="8" fill="rgba(45,45,45,0.02)" stroke="rgba(45,45,45,0.10)" stroke-width="0.8"/>
    <rect x="580" y="124" width="120" height="16" rx="2" fill="#ffffff"/>
    <text x="640" y="136" fill="rgba(45,45,45,0.40)" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.14em">PRODUCTION</text>

    <rect x="860" y="120" width="380" height="460" rx="8" fill="rgba(45,45,45,0.02)" stroke="rgba(45,45,45,0.10)" stroke-width="0.8"/>
    <rect x="1024" y="124" width="52" height="16" rx="2" fill="#ffffff"/>
    <text x="1050" y="136" fill="rgba(45,45,45,0.40)" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.14em">EVAL</text>

    <!-- Arrows first -->
    <!-- WEIGHTS: over the production zone, not through M2 -->
    <path d="M 230,280 V 184 Q 230,176 238,176 H 1042 Q 1050,176 1050,184 V 200" fill="none" stroke="#1f5a8f" stroke-width="1.2" marker-end="url(#solardb-arrow-link)"/>
    <!-- NOT PROMOTED: same-row dashed -->
    <line x1="380" y1="328" x2="490" y2="328" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#solardb-arrow)"/>
    <!-- NEXT week -->
    <line x1="1050" y1="280" x2="1050" y2="400" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#solardb-arrow)"/>

    <rect x="608" y="152" width="64" height="16" rx="2" fill="#ffffff"/>
    <text x="640" y="164" fill="#1f5a8f" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">權重</text>

    <rect x="386" y="304" width="96" height="16" rx="2" fill="#ffffff"/>
    <text x="434" y="316" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">未晉升</text>

    <rect x="1064" y="328" width="48" height="16" rx="2" fill="#ffffff"/>
    <text x="1088" y="340" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">下週</text>

    <!-- SolarDB v2.2 (store) -->
    <rect x="80" y="280" width="300" height="96" rx="6" fill="#ffffff"/>
    <rect x="80" y="280" width="300" height="96" rx="6" fill="rgba(45,45,45,0.05)" stroke="#5c5c5c" stroke-width="1"/>
    <rect x="88" y="288" width="40" height="12" rx="2" fill="transparent" stroke="rgba(92,92,92,0.50)" stroke-width="0.8"/>
    <text x="108" y="298" fill="#5c5c5c" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.08em">BASE</text>
    <text x="230" y="328" fill="#2d2d2d" font-size="16" font-weight="600" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">SolarDB v2.2</text>
    <text x="230" y="348" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">已切版 · 未贏 M2</text>

    <!-- Production M2 (focal) -->
    <rect x="490" y="280" width="300" height="96" rx="6" fill="#ffffff"/>
    <rect x="490" y="280" width="300" height="96" rx="6" fill="#eef4fa" stroke="#2e75b6" stroke-width="1"/>
    <rect x="498" y="288" width="40" height="12" rx="2" fill="transparent" stroke="rgba(46,117,182,0.50)" stroke-width="0.8"/>
    <text x="518" y="298" fill="#2e75b6" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.08em">PROD</text>
    <text x="640" y="328" fill="#2d2d2d" font-size="16" font-weight="600" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">生產骨幹 M2</text>
    <text x="640" y="348" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">本週不換</text>

    <!-- Detroit D-1 (backend) -->
    <rect x="900" y="200" width="300" height="80" rx="6" fill="#ffffff"/>
    <rect x="900" y="200" width="300" height="80" rx="6" fill="#ffffff" stroke="#2d2d2d" stroke-width="1"/>
    <rect x="908" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,45,45,0.40)" stroke-width="0.8"/>
    <text x="928" y="218" fill="#2d2d2d" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
    <text x="1050" y="244" fill="#2d2d2d" font-size="16" font-weight="600" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">日前一天協定</text>
    <text x="1050" y="264" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">已鎖定</text>

    <!-- Next-week experiment (optional) -->
    <rect x="900" y="400" width="300" height="80" rx="6" fill="#ffffff"/>
    <rect x="900" y="400" width="300" height="80" rx="6" fill="rgba(45,45,45,0.02)" stroke="rgba(45,45,45,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="908" y="408" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,45,45,0.20)" stroke-width="0.8"/>
    <text x="928" y="418" fill="#7a7a7a" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" letter-spacing="0.08em">NEXT</text>
    <text x="1050" y="444" fill="#2d2d2d" font-size="16" font-weight="600" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">遷移實驗</text>
    <text x="1050" y="464" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">4–7 微調 · 8 月留出</text>

    <!-- Legend -->
    <line x1="40" y1="608" x2="1240" y2="608" stroke="rgba(45,45,45,0.10)" stroke-width="0.8"/>
    <text x="40" y="628" fill="#5c5c5c" font-size="8" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif" letter-spacing="0.14em">LEGEND</text>

    <rect x="40" y="644" width="16" height="12" rx="2" fill="#eef4fa" stroke="#2e75b6" stroke-width="1"/>
    <text x="64" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">生產冠軍</text>

    <rect x="180" y="644" width="16" height="12" rx="2" fill="rgba(45,45,45,0.05)" stroke="#5c5c5c" stroke-width="1"/>
    <text x="204" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">基座</text>

    <rect x="280" y="644" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d2d2d" stroke-width="1"/>
    <text x="304" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">評測</text>

    <rect x="392" y="644" width="16" height="12" rx="2" fill="rgba(45,45,45,0.02)" stroke="rgba(45,45,45,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="416" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">尚未開跑</text>

    <line x1="536" y1="650" x2="576" y2="650" stroke="#1f5a8f" stroke-width="1.2" marker-end="url(#solardb-arrow-link)"/>
    <text x="584" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">權重</text>

    <line x1="668" y1="650" x2="708" y2="650" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#solardb-arrow)"/>
    <text x="716" y="654" fill="#5c5c5c" font-size="12" font-family="Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">未晉升／下週</text>
  </svg>
</body>
</html>
