<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contract check</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg
      viewBox="0 0 1280 720"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="fixture-title"
    >
      <title id="fixture-title">Contract check before landing</title>
      <defs>
        <marker
          id="fixture-arrow"
          markerWidth="8"
          markerHeight="6"
          refX="7"
          refY="3"
          orient="auto"
        >
          <polygon points="0 0, 8 3, 0 6" fill="#5c5c5c" />
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff" />
      <text x="40" y="60" fill="#2e75b6" font-size="32">
        Contract check before landing
      </text>
      <line
        x1="80"
        y1="200"
        x2="400"
        y2="200"
        stroke="#2d2d2d"
        marker-end="url(#fixture-arrow)"
      />
    </svg>
  </body>
</html>
